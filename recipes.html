<!DOCTYPE html>

  <!-- Liên kết chung tệp CSS -->

<body>

  <!-- 1. Liên kết Chuyển đến Nội dung chính -->
  <a href="#main" class="skip-link">Skip to Main Content</a>

  <header>
    <h1>Công Thức Món Ăn Ngon</h1>
    <!-- 2. Thanh điều hướng Nav -->
    <nav>
      <img src="logo.png" alt="Logo trang web">
      <ul>
        <li><a href="index.html">Trang chủ</a></li>

    <section>
      <h2>Món tráng miệng (Flex Layout)</h2>
      <div class="flex">
        <img src="dessert1.jpg" alt="Bánh kem dâu tây">
        <img src="dessert2.jpg" alt="Chè thái hoa quả">
        <img src="dessert3.jpg" alt="Kem vani socola">

  <footer>
