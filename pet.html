<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thú Cưng - Bài tập 2</title>
  <!-- Liên kết chung tệp CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. Liên kết Chuyển đến Nội dung chính -->
  <a href="#main" class="skip-link">Skip to Main Content</a>

  <header>
    <h1>Thú Cưng Của Chúng Tôi</h1>
    <!-- 2. Thanh điều hướng Nav -->
    <nav>
      <img src="logo.png" alt="Logo trang web">
      <ul>
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="pets.html">Thú cưng</a></li>
        <li><a href="recipes.html">Công thức</a></li>
      </ul>
    </nav>
  </header>

  <!-- 3. Nội dung chính với id="main" -->
  <main id="main">
    
    <!-- Phần sử dụng Bố cục Grid -->
    <section>
      <h2>Danh sách Thú cưng (Grid Layout)</h2>
      <div class="grid">
        <img src="dog1.jpg" alt="Chú chó Chihuaha đáng yêu">
        <img src="cat1.jpg" alt="Mèo Mông Cổ lông dài">
        <img src="rabbit1.jpg" alt="Thỏ trắng tai dài">
        <img src="bird1.jpg" alt="Vẹt sặc sỡ sắc màu">
      </div>
    </section>

    <!-- Phần sử dụng Bố cục Flex -->
    <section>
      <h2>Hoạt động của Thú cưng (Flex Layout)</h2>
      <div class="flex">
        <img src="pet_play1.jpg" alt="Chó đang chạy trên cỏ">
        <img src="pet_play2.jpg" alt="Mèo đang ngủ trên ghế">
        <img src="pet_play3.jpg" alt="Mèo chơi với cuộn len">
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; Bản quyền thuộc về khóa học Web Design Coursera</p>
  </footer>

</body>
</html>
